# Publishes a release when a version tag is pushed (git tag -a v2.0.0 -m "Nebula 2.0.0" && git push origin v2.0.0), as
# upstream's releases are made: Nebula-Setup.exe and its release-key signature, Nebula-Setup.exe.sig, built by
# installer/build-native-setup.ps1 and checked by tools/release_check.ps1 (docs/BUILDING.md, "Releases").
# A tag with "-beta." in it (v2.0.0-beta.1) makes Nebula-Beta-Setup.exe instead, which only betas update to; any tag
# with a "-" part is published as a pre-release.
# A pull request that changes how a release is built, and Run workflow, build the same Setup without publishing it.
# Every push to a branch builds too (without publishing), so breakage shows up before a tag.
name: Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - installer/**
      - native/build.ps1
      - tools/release_check.ps1
      - tools/release-allow.txt
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A release is never cancelled half published.
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  # The DirectX Shader Compiler Setup ships (a mod's shaders are built with it): the release cmake/rt_shaders.cmake pins.
  DXC_URL: https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/dxc_2026_09_29.zip
  DXC_SHA256: ad31b1fc8443175d204f77a611fdb3ef2ec42759bdc2f1167368de24a4a7e7f1

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      setup: ${{ steps.version.outputs.setup }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          # Publish only for a version tag pushed by hand; branch pushes and PRs just build.
          if [ "$EVENT_NAME" = push ] && [ "$REF_TYPE" = tag ]; then
            version=${REF_NAME#v}
            publish=true
          else
            version=0.0.0-test.$GITHUB_RUN_NUMBER
            publish=false
          fi
          if [ "$publish" = true ] && ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::$REF_NAME is not a version tag (v1.2.3, or v1.2.3-beta.1)"
            exit 1
          fi
          # Installer/src/Common/Updater.cs: a beta's Setup has its own name (IsBetaVersion).
          case "${version,,}" in
            *-beta.*) setup=Nebula-Beta-Setup.exe ;;
            *) setup=Nebula-Setup.exe ;;
          esac
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          {
            echo "version=$version"
            echo "setup=$setup"
            echo "prerelease=$prerelease"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "Nebula $version: $setup (pre-release: $prerelease, publish: $publish)"
  host:
    name: Host
    if: false
    # Visual Studio 2022's MSVC, as the Build workflow's host job uses.
    runs-on: windows-2022
    steps:
      - uses: actions/Checkout@v7
      # The built-in mods, packed in the lumalink submodule (cmake/nebula_builtin_mods.cmake).
      - name: Built-in mods
        run: git submodule update --init --depth 1 lumalink
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      # The libraries CMake builds at configure time, from the Build workflow's Direct3D 12 job: restored only, so a
      # release never writes the cache.
      - name: Configure-time dependencies
        uses: actions/cache/restore@v6
        with:
          path: |
            build/host/archive-deps
            build/host/fidelityfx.built
            build/host/_deps
          key: host-deps-OFF-${{ hashFiles('cmake/**', 'third_party/archive/**') }}
      - name: Configure
        # A release build: cross-file optimization on (NEBULA_HOST_IPO's default). There is one build kind: tests
        # attach their hooks from outside (tools/release_check.ps1 checks no source names a build kind).
        # No AVX2: the host target must run on machines without it.
        run: >-
          cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_FLAGS="/D__AVX2__=0"
          -DNEBULA_ENABLE_AVX2=OFF
      - name: Build
        # The program Setup ships, not the tests.
        run: cmake --build build/host --target NebulaNative
      - uses: actions/upload-artifact@v7
        with:
          name: release-host
          path: build/host/NebulaNative.exe
          retention-days: 1
          if-no-files-found: error
      # Kept for reading crash dumps of this release (docs/DIAGNOSTICS.md); not published.
      - uses: actions/upload-artifact@v7
        with:
          name: release-symbols
          path: build/host/NebulaNative.pdb
          retention-days: 90
          if-no-files-found: warn

  game:
    name: Game module
    if: false
    runs-on: windows-2025
    steps:
      - uses: actions/Checkout@v7
      # The built-in mods, packed in the lumalink submodule (cmake/nebula_builtin_mods.cmake).
      - name: Built-in mods
        run: git submodule update --init --depth 1 lumalink
      - name: Configure-time dependencies
        uses: actions/cache/restore@v6
        with:
          path: |
            build/game/archive-deps
          key: game-archive-deps-${{ hashFiles('cmake/**', 'third_party/archive/**') }}
      - name: Build
        if: false
        run: .\native\build.ps1 -Petari native\petari -Build build\game
      - uses: actions/upload-artifact@v7
        with:
          name: release-game
          path: build/game/smg_game.dll
          retention-days: 1
          if-no-files-found: error


  launcher:
    name: Launcher
    needs: [version]
    runs-on: windows-2025
    steps:
      - uses: actions/Checkout@v7
      - name: BuildInfo
        shell: powershell
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: $installer = Join-Path $env:GITHUB_WORKSPACE 'installer'; $repo = $env:GITHUB_WORKSPACE; $commit = (& git -C $repo rev-parse HEAD).Trim(); $publicKey = (Get-Content -LiteralPath (Join-Path $installer 'release-public-key.xml') -Raw).Trim(); $storeVersion = [uint32](Get-Content -LiteralPath (Join-Path $repo 'runtime\include\galaxy\store_version.inc') -Raw).Trim(); $work = Join-Path $env:RUNNER_TEMP 'launcher-build'; New-Item -ItemType Directory -Force $work | Out-Null; $buildInfoPath = Join-Path $work 'BuildInfo.cs'; $text = 'namespace Nebula{' + [Environment]::NewLine + '    internal static class BuildInfo{' + [Environment]::NewLine + '        public const string Version = "' + $env:VERSION + '";' + [Environment]::NewLine + '        public const string Commit = "' + $commit + '";' + [Environment]::NewLine + '        public const string Repository = "' + $env:GITHUB_REPOSITORY + '";' + [Environment]::NewLine + '        public const string ReleasePublicKeyXml = "' + $publicKey.Replace('"','\"') + '";' + [Environment]::NewLine + '        public const uint StoreVersion = ' + $storeVersion + ';' + [Environment]::NewLine + '        public static readonly bool RayTracing = false;' + [Environment]::NewLine + '    }' + [Environment]::NewLine + '}'; [IO.File]::WriteAllText($buildInfoPath, $text, (New-Object Text.UTF8Encoding $false))
      - name: Launcher
        shell: powershell
        run: $installer = Join-Path $env:GITHUB_WORKSPACE 'installer'; $repo = $env:GITHUB_WORKSPACE; $work = Join-Path $env:RUNNER_TEMP 'launcher-build'; $buildInfoPath = Join-Path $work 'BuildInfo.cs'; $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'; $common = @(Get-ChildItem (Join-Path $installer 'src\Common\*.cs') | ForEach-Object FullName) + $buildInfoPath; $textTable = '/resource:' + (Join-Path $repo 'localization\NebulaText.tsv') + ',NebulaText.tsv'; $references = @('/r:System.Web.Extensions.dll','/r:System.IO.Compression.dll','/r:System.IO.Compression.FileSystem.dll','/r:System.Windows.Forms.dll','/r:System.Drawing.dll','/r:System.Core.dll'); $manifestFile = Join-Path $installer 'app.manifest'; $iconFile = Join-Path $installer 'assets\nebula.ico'; $launcherSources = @(Get-ChildItem (Join-Path $installer 'src\Launcher\*.cs') | ForEach-Object FullName); $launcher = Join-Path $work 'NebulaLauncher.exe'; & $csc (@('/nologo','/target:winexe','/platform:x64','/optimize+',('/win32manifest:' + $manifestFile),('/win32icon:' + $iconFile),('/out:' + $launcher)) + $references + $textTable + $common + $launcherSources); if ($LASTEXITCODE -ne 0) { throw "csc (launcher) failed with exit code $LASTEXITCODE" }; $settingsApp = Join-Path $work 'NebulaSettings.exe'; & $csc (@('/nologo','/target:winexe','/platform:x64','/optimize+','/define:NEBULA_SETTINGS_APP',('/win32manifest:' + $manifestFile),('/win32icon:' + $iconFile),('/out:' + $settingsApp)) + $references + $textTable + $common + $launcherSources); if ($LASTEXITCODE -ne 0) { throw "csc (settings) failed with exit code $LASTEXITCODE" }; Get-ChildItem $work -Filter '*.exe' | Format-Table Name, Length
      - uses: actions/upload-artifact@v7
        with:
          name: release-launcher
          path: |
            ${{ runner.temp }}/launcher-build/NebulaLauncher.exe
            ${{ runner.temp }}/launcher-build/NebulaSettings.exe
          retention-days: 1
          if-no-files-found: error          
  setup:
    name: Setup
    needs: [version]
    runs-on: windows-2025
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SETUP: ${{ needs.version.outputs.setup }}
    steps:
      - uses: actions/Checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      # Outside the tree, so that build-native-setup.ps1 records a clean commit.
      - uses: actions/download-artifact@v8
        if: false
        with:
          name: release-host
          path: ${{ runner.temp }}/bin
      - uses: actions/download-artifact@v8
        if: false
        with:
          name: release-game
          path: ${{ runner.temp }}/bin
      - name: Setup
        run: >-
          .\installer\build-native-setup.ps1 -Version $env:VERSION
          -OutputDirectory (Join-Path $env:RUNNER_TEMP 'dist')
          -SetupName $env:SETUP -Repository $env:GITHUB_REPOSITORY

      - uses: actions/upload-artifact@v7
        with:
          name: nebula-setup
          path: ${{ runner.temp }}/dist/${{ env.SETUP }}*
          retention-days: 14
          if-no-files-found: error
         

  publish:
    name: Publish
    needs: [version, setup]

    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - run: echo "publish disabled"
