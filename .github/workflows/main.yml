name: Build Nebula

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  LLVM_VERSION: '21.1.0'
  CMAKE_VERSION: '3.30.5'
  NINJA_VERSION: '1.12.1'
  DOTNET_VERSION: '8.0.x'

jobs:
  build:
    name: Build (${{ matrix.config.name }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: d3d11
            d3d12: 'OFF'
            vulkan: 'OFF'
            d3d11: 'ON'
            fsr3: 'OFF'
          - name: vulk
            d3d12: 'OFF'
            vulkan: 'OFF'
            d3d11: 'OFF'
            fsr3: 'OFF'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Diagnose luma type registry inputs
        shell: pwsh
        run: |
          $dbPath = "build\game\compile_commands.json"
          if (Test-Path $dbPath) {
            $db = Get-Content $dbPath -Raw | ConvertFrom-Json
            $files = $db | ForEach-Object { $_.file } | Sort-Object -Unique
            $hits = $files | Select-String -Pattern 'CustomTagProcessor|MessageEditor' | Select-Object -First 20
            if (-not $hits) {
              Write-Host "::warning::No TU in compile_commands.json references CustomTagProcessor/MessageEditor — GroupFunctionInfo/Operation/ContextType are never parsed. Enable that code in native/CMakeLists.txt or exclude the members in language/types.md."
            } else {
              $hits
            }
          } else {
            Write-Host "compile_commands.json not found yet (it is generated by the game-module configure)"
          }
          
      - name: Set up Rust
        if : false
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        if : false
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.config.name }}

      - name: Set up .NET
        if : false

        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
        with:
          version: ${{ env.NINJA_VERSION }}

      # ---- LLVM 21 for both the host (libclang for instrument.py) and the game module (clang++.exe) ----
      - name: Set up LLVM ${{ env.LLVM_VERSION }}
        shell: pwsh
        run: |
          $ver = "${{ env.LLVM_VERSION }}"
          $dir = "C:\Program Files\LLVM-$ver"
          if (-not (Test-Path "$dir\bin\clang.exe")) {
            $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$ver/LLVM-$ver-win64.exe"
            $out = "$env:RUNNER_TEMP\LLVM-$ver-win64.exe"
            Invoke-WebRequest -Uri $url -OutFile $out
            Start-Process -FilePath $out -ArgumentList "/S","/D=$dir" -Wait
          }
          & "$dir\bin\clang.exe" --version | Select-Object -First 1
          foreach ($f in @("clang.exe","clang++.exe","libclang.dll","llvm-rc.exe")) {
            if (-not (Test-Path "$dir\bin\$f")) { throw "LLVM install incomplete: missing $dir\bin\$f" }
          }
          "$dir\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Probe LLVM installs
        shell: pwsh
        run: |
          foreach ($p in @(
            "C:\Program Files\LLVM\bin",
            "C:\Program Files\LLVM-${{ env.LLVM_VERSION }}\bin",
            "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin"
          )) {
            Write-Host "== $p =="
            if (Test-Path $p) {
              Get-ChildItem $p -Filter "clang*.exe" -ErrorAction SilentlyContinue |
                ForEach-Object { Write-Host "  $($_.Name)" }
              Get-ChildItem $p -Filter "libclang.dll" -ErrorAction SilentlyContinue |
                ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }
            } else { Write-Host "  (missing)" }
          }

      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: build/host/_deps
          key: cmake-deps-${{ matrix.config.name }}-${{ hashFiles('CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            cmake-deps-${{ matrix.config.name }}-

      - name: Build game files (nebula-import)
        if: false
        run: cargo build --release --locked -p nebula-import

      - name: Upload nebula-import artifact
        if: false
        uses: actions/upload-artifact@v4
        with:
          name: nebula-import-${{ matrix.config.name }}-${{ github.sha }}
          path: target/release/nebula-import.exe
          if-no-files-found: error
          retention-days: 30

      - name: Configure host
        shell: pwsh
        env:
          LIBCLANG_PATH: "C:\\Program Files\\LLVM-${{ env.LLVM_VERSION }}\\bin"
        run: |
          $clang   = "C:\Program Files\LLVM-${{ env.LLVM_VERSION }}\bin\clang.exe"
          $clangxx = "C:\Program Files\LLVM-${{ env.LLVM_VERSION }}\bin\clang++.exe"
          if (-not (Test-Path $clang))   { throw "clang.exe missing: $clang" }
          if (-not (Test-Path $clangxx)) { throw "clang++.exe missing: $clangxx" }
          cmake -S . -B build\host -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER="$clang" `
            -DCMAKE_CXX_COMPILER="$clangxx" `
            -DNEBULA_VULKAN=${{ matrix.config.vulkan }} `
            -DNEBULA_D3D11=${{ matrix.config.d3d11 }} `
            -DNEBULA_FSR3=${{ matrix.config.fsr3 }}
      - name: Diagnose luma type registry inputs
        shell: pwsh
        run: |
          $dbPath = "build\game\compile_commands.json"
          if (Test-Path $dbPath) {
            $db = Get-Content $dbPath -Raw | ConvertFrom-Json
            $files = $db | ForEach-Object { $_.file } | Sort-Object -Unique
            $hits = $files | Select-String -Pattern 'CustomTagProcessor|MessageEditor' | Select-Object -First 20
            if (-not $hits) {
              Write-Host "::warning::No TU in compile_commands.json references CustomTagProcessor/MessageEditor — GroupFunctionInfo/Operation/ContextType are never parsed. Enable that code in native/CMakeLists.txt or exclude the members in language/types.md."
            } else {
              $hits
            }
          } else {
            Write-Host "compile_commands.json not found yet (it is generated by the game-module configure)"
          }


      - name: List generated targets
        shell: pwsh
        run: ninja -C build\host -t targets all | Select-String -Pattern '\.exe:'

      # ---- Renderer builds: exactly one runs per matrix leg ----

      - name: Build host (Nebula — D3D12)
        if: ${{ matrix.config.d3d12 == 'ON' }}
        run: cmake --build build\host --target Nebula --config Release

      - name: Build host (NebulaVk — Vulkan)
        if: ${{ matrix.config.vulkan == 'ON' }}
        run: cmake --build build\host --target NebulaVk --config Release

    
      
      # ---- Game module: build.ps1 now honors LLVM_ROOT / LIBCLANG_PATH / -LlvmRoot ----
      - name: Build game module (smg_game.dll) with diagnostics
        if: false
        id: smg
        shell: pwsh
        env:
          LLVM_ROOT: "C:\\Program Files\\LLVM-${{ env.LLVM_VERSION }}"
          LIBCLANG_PATH: "C:\\Program Files\\LLVM-${{ env.LLVM_VERSION }}\\bin"
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "=== Build game module ==="
          & .\native\build.ps1 -Petari native\petari -Build build\game -LlvmRoot "$env:LLVM_ROOT" 2>&1 |
            Tee-Object -FilePath "$env:RUNNER_TEMP\smg-build.log"
          $buildExit = $LASTEXITCODE

          if ($buildExit -ne 0) {
            Write-Host "::warning::smg_game.dll build failed (exit $buildExit); collecting diagnostics"

            Write-Host "=== Compile database ==="
            $dbPath = "build\game\compile_commands.json"
            if (-not (Test-Path $dbPath)) {
              Write-Host "::warning::compile_commands.json not produced"
            } else {
              Write-Host "DB: $dbPath ($((Get-Item $dbPath).Length) bytes)"
              try {
                $db = Get-Content $dbPath -Raw | ConvertFrom-Json
                $files = $db | ForEach-Object { $_.file } | Sort-Object -Unique
                Write-Host "TUs in DB: $($files.Count)"
                $hits = $files | Select-String -Pattern 'CustomTagProcessor|MessageEditor'
                if (-not $hits) {
                  Write-Host "::warning::No TU references CustomTagProcessor/MessageEditor — GroupFunctionInfo/Operation/ContextType are never parsed."
                } else {
                  Write-Host "TUs referencing them:"
                  $hits
                }
              } catch {
                Write-Host "::warning::Failed to parse compile_commands.json: $_"
              }
            }

            Write-Host "=== luma_types outputs ==="
            $out = "build\game\luma_types"
            if (Test-Path $out) {
              Get-ChildItem $out -ErrorAction SilentlyContinue | Format-Table Name, Length | Out-String | Write-Host
            } else {
              Write-Host "(missing)"
            }

            Write-Host "=== Source search for the unresolved names ==="
            Get-ChildItem -Recurse -Include *.h,*.hpp,*.inl -Path native -ErrorAction SilentlyContinue |
              Select-String -Pattern 'struct\s+GroupFunctionInfo|class\s+GroupFunctionInfo|using\s+Operation\b|typedef.*\bOperation\b|ContextType\b' |
              Select-Object -First 40 |
              Format-Table Path, LineNumber, Line -AutoSize | Out-String | Write-Host
          }

          Write-Host "=== game-module build outcome: $buildExit ==="
          if ($buildExit -ne 0) { exit $buildExit }
      - name: Upload smg_game.dll
        if: false
        uses: actions/upload-artifact@v4
        with:
          name: nebula-smg-game-${{ matrix.config.name }}-${{ github.sha }}
          path: build\game\smg_game.dll
          if-no-files-found: error
          retention-days: 30
     
      - name: Build host (NebulaD11 — Direct3D 11)
        if: ${{ matrix.config.d3d11 == 'ON' }}
        run: cmake --build build\host --target NebulaD11 --config Release
        
      - name: Build Setup and launcher (.NET)
        shell: pwsh
        run: |
          $projects = @("setup\Setup.csproj", "launcher\Launcher.csproj")
          $found = $projects | Where-Object { Test-Path $_ }
          if (-not $found) {
            Write-Host "No Setup/launcher .csproj found; skipping (edit this step if they live elsewhere)."
          } else {
            foreach ($proj in $found) {
              Write-Host "Building $proj"
              dotnet build $proj -c Release
              if ($LASTEXITCODE -ne 0) { throw "dotnet build $proj failed" }
            }
          }

      # ---- Assemble: single step, if/elseif/else over the renderer flags ----

      - name: Assemble runtime folder
        if: false
        shell: pwsh
        run: |
          $out = "build\dist-${{ matrix.config.name }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          if ('${{ matrix.config.d3d12 }}' -eq 'ON') {
            $exe = "build\host\Nebula.exe"
          } elseif ('${{ matrix.config.vulkan }}' -eq 'ON') {
            $exe = "build\host\NebulaVk.exe"
          } elseif ('${{ matrix.config.d3d11 }}' -eq 'ON') {
            $exe = "build\host\NebulaD11.exe"
          } else {
            throw "No renderer selected for config '${{ matrix.config.name }}'"
          }

          if (-not (Test-Path $exe)) { throw "Expected renderer exe not found: $exe" }
          Copy-Item $exe $out -ErrorAction Stop
          Copy-Item build\game\smg_game.dll $out -ErrorAction Stop
          Copy-Item target\release\nebula-import.exe $out -ErrorAction Stop

          if (Test-Path "vendor") {
            Copy-Item -Recurse vendor $out
          }
          Get-ChildItem -Recurse -Filter "*.exe" -Path setup,launcher -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\bin\\Release\\' } |
            ForEach-Object { Copy-Item $_.FullName $out }
          Get-ChildItem $out | Format-Table Name, Length

      # ---- Upload: per-config folder ----

      - name: Upload artifacts (${{ matrix.config.name }})
        uses: actions/upload-artifact@v4
        with:
          name: nebula-build-${{ matrix.config.name }}-${{ github.sha }}
          path: build\dist-${{ matrix.config.name }}
          if-no-files-found: error
          retention-days: 30
# ---- Upload: whole build folder ----

      - name: Upload full build folder
        if: ${{ matrix.config.d3d11 == 'ON' }}
        uses: actions/upload-artifact@v4
        with:
          name: nebula-build-host-${{ github.sha }}
          path: build\host\
          if-no-files-found: error
          retention-days: 30
      # ---- Upload: D3D11 exe on its own ----

      - name: Upload NebulaD11.exe
        if: ${{ matrix.config.d3d11 == 'ON' }}
        uses: actions/upload-artifact@v4
        with:
          name: nebula-d3d11-${{ github.sha }}
          path: build\host\NebulaD11.exe
          if-no-files-found: error
          retention-days: 30

  package:
    name: Package release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create zip archives
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Get-ChildItem -Directory artifacts |
            Where-Object { $_.Name -like 'nebula-build-*' } |
            ForEach-Object {
              $name = $_.Name -replace "-$($env:GITHUB_SHA)", ""
              $zip  = "release\$name.zip"
              Compress-Archive -Path "$($_.FullName)\*" -DestinationPath $zip -Force
              Write-Host "Created $zip"
            }
          Get-ChildItem release

      - name: Upload release archives
        uses: actions/upload-artifact@v4
        with:
          name: nebula-release-archives
          path: release/*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
